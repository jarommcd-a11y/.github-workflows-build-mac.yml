name: Build macOS Standalone App (v12.0)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tcl/Tk & dependencies
        run: |
          brew install python-tk@3.12 libsndfile
          python -m pip install --upgrade pip
          pip install pillow -r requirements.txt

      - name: Build macOS .app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Audio_Analyser_Pro_V12.0_MacOS_Beta.py" \
            --icon "Serato_Audio_Analyser_Pro_v12.ico" \
            --collect-all tkinterdnd2 \
            --collect-all librosa \
            --collect-all mutagen \
            --hidden-import numba \
            --hidden-import scipy \
            --hidden-import soundfile \
            --hidden-import audioread \
            Audio_Analyser_Pro_V12.0_MacOS_Beta.py

      - name: Zip the .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Audio_Analyser_Pro_V12.0_MacOS_Beta.py" "Audio_Analyser_Pro_V12.0_MacOS_Beta.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audio_Analyser_Pro_V12.0_MacOS_Beta
          path: dist/Audio_Analyser_Pro_V12.0_MacOS_Beta.zip
